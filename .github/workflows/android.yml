name: Android APK and emulator test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.johndsdev.ruler/.MainActivity
            sleep 5
            adb shell pidof com.johndsdev.ruler
            adb shell dumpsys activity activities | grep 'com.johndsdev.ruler/.MainActivity'
            if adb logcat -d -t 5000 | grep -E 'FATAL EXCEPTION|Process: com.johndsdev.ruler'; then exit 1; fi
